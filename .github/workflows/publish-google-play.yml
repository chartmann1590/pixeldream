name: Publish to Google Play

# =====================================================================
# MANUAL-ONLY publishing workflow.
#
# This workflow has NO automatic triggers. It can only run via explicit
# `workflow_dispatch` from the Actions tab, and additionally requires the
# dispatcher to type "publish" into the confirm_play_publish input. Pushes,
# pull requests, tags, schedules, and other workflow completions can NEVER
# trigger a Google Play production release from this file.
# =====================================================================
on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: 'Type "publish" to publish to the Google Play production track'
        required: true
        type: string
      release_notes:
        description: 'Optional release notes (overrides auto-generated commit log)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-google-play
  cancel-in-progress: false

jobs:
  publish:
    name: Publish production release to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_FORCE_TEST_ADS: "false"
      FEEDBACK_PROXY_URL: ${{ secrets.FEEDBACK_PROXY_URL }}
      GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
      GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
    steps:
      - name: Require explicit publish confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm_play_publish }}" != "publish" ]; then
            echo "::error::confirm_play_publish must be set to exactly 'publish'. Aborting to protect the production track."
            exit 1
          fi
          echo "Confirmed: publishing to Google Play production track."

      - name: Verify Play service account secret is present
        shell: bash
        env:
          PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SA_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is missing. Add the Play publisher service account key."
            exit 1
          fi
          echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is present."

      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret empty; falling back to base64 variant."
            echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          # Validate it parses as JSON.
          python3 -c "import json,sys; json.load(open('app/google-services.json'))"
          grep -q '"package_name": "com.hartmann.pixeldream"' app/google-services.json

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release.keystore.jks"
          test -s "${{ github.workspace }}/release.keystore.jks"

      - name: Validate production ad configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMOB_APP_ID"
          test -n "$ADMOB_BANNER_ID"
          test -n "$ADMOB_INTERSTITIAL_ID"
          case "$ADMOB_APP_ID $ADMOB_BANNER_ID $ADMOB_INTERSTITIAL_ID" in
            *ca-app-pub-3940256099942544*)
              echo "::error::Release configuration contains a Google sample ad ID; refusing to publish to production."
              exit 1
              ;;
          esac
          echo "Ad configuration is production-ready."

      - name: Compute release version (monotonic, UTC date/time based)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # High monotonic version code that will never be lower than prior
          # Play artifacts: yy + day-of-year + HH + MM (UTC).
          version_code="$(date -u +'%y%j%H%M')"
          # BASE_VERSION is the repo's versionName base (0.1.0).
          base_version="0.1.0"
          version_name="${base_version}.$(date -u +'%Y%m%d.%H%M')"
          {
            echo "ANDROID_VERSION_CODE=${version_code}"
            echo "ANDROID_VERSION_NAME=${version_name}"
            echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
            echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          } >> "$GITHUB_ENV"
          echo "Computed versionCode=${version_code} versionName=${version_name}"

      - name: Generate Play release notes
        shell: bash
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p distribution/whatsnew
          out="distribution/whatsnew/whatsnew-en-US"
          if [ -n "$RELEASE_NOTES_INPUT" ]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > "$out"
          else
            # Commit subjects since the most recent tag, if any.
            prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "$prev_tag" ]; then
              git log "${prev_tag}..HEAD" --pretty=format:'- %s' > "$out"
            else
              git log -n 20 --pretty=format:'- %s' > "$out"
            fi
            if [ ! -s "$out" ]; then
              if [ -f listing/whats_new.txt ]; then
                cp listing/whats_new.txt "$out"
              else
                printf 'Bug fixes and performance improvements.\n' > "$out"
              fi
            fi
          fi
          # Play en-US whatsnew must be <= 500 bytes.
          head -c 500 "$out" > "$out.tmp" && mv "$out.tmp" "$out"
          echo "---- release notes ($out) ----"
          cat "$out"

      - name: Lint release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintRelease

      - name: Play release unit tests
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest

      - name: Build Play release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease uploadCrashlyticsSymbolFileRelease

      - name: Locate release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          aab="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$aab"
          echo "aab_path=${aab}" >> "$GITHUB_OUTPUT"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$mapping" ]; then
            echo "mapping_path=${mapping}" >> "$GITHUB_OUTPUT"
            echo "Found R8 mapping: ${mapping}"
          else
            echo "No R8 mapping file found (minification may have been disabled)."
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixeldream-play-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload obfuscation mapping
        if: steps.artifacts.outputs.mapping_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: pixeldream-play-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish to Google Play (production track)
        id: publish
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hartmann.pixeldream
          releaseFiles: ${{ steps.artifacts.outputs.aab_path }}
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: ${{ steps.artifacts.outputs.mapping_path }}

      - name: Report published version
        shell: bash
        run: |
          echo "::notice::Published com.hartmann.pixeldream to production — versionCode=${ANDROID_VERSION_CODE} versionName=${ANDROID_VERSION_NAME}"

      - name: Clean up keystore
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/release.keystore.jks"
