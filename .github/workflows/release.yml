name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_FORCE_TEST_ADS: "false"
      FEEDBACK_PROXY_URL: ${{ secrets.FEEDBACK_PROXY_URL }}
      GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
      GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore.jks

      - name: Validate production ad configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMOB_APP_ID"
          test -n "$ADMOB_BANNER_ID"
          test -n "$ADMOB_INTERSTITIAL_ID"
          case "$ADMOB_APP_ID $ADMOB_BANNER_ID $ADMOB_INTERSTITIAL_ID" in
            *ca-app-pub-3940256099942544*)
              echo "Release configuration contains a Google sample ad ID"
              exit 1
              ;;
          esac

      - name: Build signed APK and App Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease uploadCrashlyticsSymbolFileRelease

      - name: Reject test ads in release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          test -n "$APK"
          if unzip -p "$APK" 'classes*.dex' | strings | grep -E 'ca-app-pub-3940256099942544/(6300978111|1033173712)'; then
            echo "Google test ad unit ID found in release APK"
            exit 1
          fi
          echo "Release APK contains no Google test ad unit IDs."

      - name: Verify 16 KB APK alignment
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          test -n "$APK"
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixeldream-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixeldream-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: pixeldream-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      # Uncomment once the Play Console app listing and a service-account JSON
      # secret (PLAY_SERVICE_ACCOUNT_JSON) exist:
      # - name: Upload to Play Console (internal track)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.hartmann.pixeldream
      #     releaseFiles: app/build/outputs/bundle/release/*.aab
      #     track: internal
