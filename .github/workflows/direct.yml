name: Direct download build (Stripe) + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with -Pstore=direct
# (Stripe Checkout instead of Google Play Billing, no Google Play links, no Play review prompt).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
    paths-ignore: ['.github/direct/e2e/**', '.github/workflows/tab-restore-e2e.yml']
  workflow_dispatch:
    inputs:
      steps:
        description: steps file under .github/direct (steps-release.txt or steps-restore.txt)
        default: steps-release.txt
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_FORCE_TEST_ADS: 'false'
      FEEDBACK_PROXY_URL: ${{ secrets.FEEDBACK_PROXY_URL }}
      GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
      GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
    - name: Install native build tools
      run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
    - name: Cache Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Decode google-services.json
      env:
        GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
    - name: Decode signing keystore
      env:
        RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore.jks
    - name: Validate production ad configuration
      shell: bash
      run: |
        set -euo pipefail
        test -n "$ADMOB_APP_ID"
        test -n "$ADMOB_BANNER_ID"
        test -n "$ADMOB_INTERSTITIAL_ID"
        case "$ADMOB_APP_ID $ADMOB_BANNER_ID $ADMOB_INTERSTITIAL_ID" in
          *ca-app-pub-3940256099942544*)
            echo "Release configuration contains a Google sample ad ID"
            exit 1
            ;;
        esac
    - name: Direct version (above every shipped code)
      # Play/Amazon codes are yyDDDHHMM dates; a fresh UTC stamp is always above every earlier code, so each direct build is an update.
      run: |
        C=$(date -u +%y%j%H%M); N=0.1.2
        { echo "ANDROID_VERSION_CODE=$C"; echo "ANDROID_VERSION_NAME=$N"; echo "VERSION_CODE=$C"; echo "VERSION_NAME=$N"; } >> "$GITHUB_ENV"
        echo "::notice title=Direct version::$N ($C)"
    - name: Build direct APK (store=direct)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -o pipefail
        ./gradlew :app:assembleRelease -Pstore=direct  2>&1 | tee -a /tmp/dsk-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p dsk-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" dsk-apk/PixelDream-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/PixelDream-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/PixelDream-direct-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/PixelDream-direct-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship the direct APK to Tab's private drop (for the restore e2e; 48 h TTL)
      if: success()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/direct/direct-upload.sh dsk-apk pixeldream-ci-${{ github.run_number }}
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Stop Gradle daemons + free runner disk before the emulator
      if: success()
      run: |
        ./gradlew --stop 2>/dev/null || (cd android 2>/dev/null && ./gradlew --stop) || true
        df -h / | tail -1
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (phone, Google APIs, no Play Store)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 7168M
        disk-size: 10240M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        emulator-boot-timeout: 1500
        script: STEPS_FILE=${{ github.event.inputs.steps || 'steps-release.txt' }} bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_PixelDream_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/PixelDream-direct-release.apk