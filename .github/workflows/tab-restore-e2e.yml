name: Tab Stripe restore e2e (emulator)
# Tab, Nov 9 2026: buy -> unlock -> uninstall -> reinstall -> Restore (unknown email refused, buyer email restored)
# on a RELEASED direct APK named in .github/direct/e2e/run-id.txt. Builds nothing, publishes nothing.
on:
  push:
    branches: [direct-stripe]
    paths: ['.github/direct/e2e/run-id.txt']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
    - name: Read run config
      run: |
        grep -E '^E2E_(ID|APP|PKG|APK)=' .github/direct/e2e/run-id.txt >> "$GITHUB_ENV"; cat .github/direct/e2e/run-id.txt
    - name: Download released APK
      run: |
        mkdir -p dsk-apk && curl -sfL -o dsk-apk/app.apk "$E2E_APK" && sha256sum dsk-apk/app.apk && ls -la dsk-apk
    - name: Free runner disk
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk 2>/dev/null || true
        df -h / | tail -1
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator e2e
      uses: reactivecircus/android-emulator-runner@v2
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 7168M
        disk-size: 12288M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        emulator-boot-timeout: 1500
        script: bash .github/direct/restore-e2e.sh
    - name: Upload results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/direct/direct-upload.sh /tmp/dsk-out e2e_${E2E_APP}_${E2E_ID}_r${{ github.run_number }}
