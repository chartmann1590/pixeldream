name: Auto Release

# =====================================================================
# Builds a signed release APK + App Bundle on every commit/push, assigns
# each build a fresh monotonic versionCode (yyDDDHHMM UTC), renames the
# artifacts to include the app name and version code, and publishes them
# as a GitHub Release so they appear in the repo's Releases area.
#
# Required repository secrets (same ones used by release.yml):
#   RELEASE_KEYSTORE_B64     base64-encoded release keystore (.jks)
#   KEYSTORE_PASSWORD        keystore password
#   KEY_ALIAS                release key alias
#   KEY_PASSWORD             release key password
#   GOOGLE_SERVICES_JSON_B64 base64-encoded google-services.json
#   ADMOB_APP_ID / ADMOB_BANNER_ID / ADMOB_INTERSTITIAL_ID
#   FEEDBACK_PROXY_URL / GH_REPO_OWNER / GH_REPO_NAME
# =====================================================================

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_NAME: PixelDream
      BASE_VERSION_NAME: "0.1.0"
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_FORCE_TEST_ADS: "false"
      FEEDBACK_PROXY_URL: ${{ secrets.FEEDBACK_PROXY_URL }}
      GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
      GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compute release version (monotonic versionCode)
        id: version
        shell: bash
        env:
          BASE_VERSION_NAME: ${{ env.BASE_VERSION_NAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # yyDDDHHMM UTC -> monotonic, always greater than any prior build.
          version_code="$(date -u +'%y%j%H%M')"
          version_name="${BASE_VERSION_NAME}.$(date -u +'%Y%m%d.%H%M')"
          short_sha="$(printf '%s' "$COMMIT_SHA" | cut -c1-7)"
          {
            echo "version_code=${version_code}"
            echo "version_name=${version_name}"
            echo "short_sha=${short_sha}"
            echo "tag=auto-v${version_code}-${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed versionCode=${version_code} versionName=${version_name} tag=auto-v${version_code}-${short_sha}"

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_B64"
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release.keystore.jks"
          test -s "${{ github.workspace }}/release.keystore.jks"

      - name: Validate production ad configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMOB_APP_ID"
          test -n "$ADMOB_BANNER_ID"
          test -n "$ADMOB_INTERSTITIAL_ID"
          case "$ADMOB_APP_ID $ADMOB_BANNER_ID $ADMOB_INTERSTITIAL_ID" in
            *ca-app-pub-3940256099942544*)
              echo "::error::Release configuration contains a Google sample ad ID"
              exit 1
              ;;
          esac

      - name: Build signed APK and App Bundle
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease uploadCrashlyticsSymbolFileRelease

      - name: Reject test ads in release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          if unzip -p "$APK" 'classes*.dex' | strings | grep -E 'ca-app-pub-3940256099942544/(6300978111|1033173712)'; then
            echo "::error::Google test ad unit ID found in release APK"
            exit 1
          fi

      - name: Verify 16 KB APK alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Stage artifacts with descriptive names
        id: stage
        shell: bash
        env:
          APP_NAME: ${{ env.APP_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p distribution
          apk_src="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          aab_src="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$apk_src"
          test -n "$aab_src"
          apk_dst="distribution/${APP_NAME}-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          aab_dst="distribution/${APP_NAME}-${VERSION_NAME}-vc${VERSION_CODE}.aab"
          cp "$apk_src" "$apk_dst"
          cp "$aab_src" "$aab_dst"
          # Copy R8 mapping alongside the artifacts for crash symbolication.
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt \
               "distribution/${APP_NAME}-${VERSION_NAME}-vc${VERSION_CODE}-mapping.txt"
          fi
          {
            echo "apk_path=${apk_dst}"
            echo "aab_path=${aab_dst}"
          } >> "$GITHUB_OUTPUT"
          echo "---- staged artifacts ----"
          ls -lh distribution

      - name: Build release notes
        id: notes
        shell: bash
        env:
          APP_NAME: ${{ env.APP_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="distribution/release-notes.md"
          {
            printf '## %s Auto Build\n\n' "$APP_NAME"
            printf -- '- **Version Code**: %s\n' "$VERSION_CODE"
            printf -- '- **Version Name**: %s\n' "$VERSION_NAME"
            printf -- '- **Commit**: [%s](https://github.com/%s/commit/%s)\n' "$SHORT_SHA" "$REPO" "$SHORT_SHA"
            printf -- '- **Branch**: %s\n' "$BRANCH"
            printf -- '- **Built**: %s UTC\n\n' "$(date -u +'%Y-%m-%d %H:%M:%S')"
            printf '### Artifacts\n'
            printf -- '- `%s-%s-vc%s.apk` — signed APK (arm64-v8a)\n' "$APP_NAME" "$VERSION_NAME" "$VERSION_CODE"
            printf -- '- `%s-%s-vc%s.aab` — signed App Bundle (Play Store)\n\n' "$APP_NAME" "$VERSION_NAME" "$VERSION_CODE"
            printf '### Recent commits\n\n'
            git log -n 10 --pretty=format:'- %h %s'
          } > "$notes"
          echo "---- release notes ----"
          cat "$notes"

      - name: Clean up keystore
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/release.keystore.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.APP_NAME }} ${{ steps.version.outputs.version_name }} (vc${{ steps.version.outputs.version_code }})
          body_path: distribution/release-notes.md
          files: |
            ${{ steps.stage.outputs.apk_path }}
            ${{ steps.stage.outputs.aab_path }}
          prerelease: false
          make_latest: "true"
          generate_release_notes: false

      - name: Upload build artifacts (CI retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version_name }}-vc${{ steps.version.outputs.version_code }}
          path: distribution/*
          if-no-files-found: warn
