# TEMPORARY smoke-test scaffolding for PR #42 verification.
# TEMPORARY: push-triggered so the run starts on push to this branch.
# DELETE BEFORE MERGING.
name: Emulator smoke test (temporary)

on:
  push:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Deliberately under-spec: the requirements warning dialog SHOULD appear.
          - config: low-spec
            api-level: 30
            ram-size: 2048M
            disk-size: 4096M
            emulator-options: "-no-window -no-boot-anim -no-audio"
          # Meets the minimums: NO dialog should appear, app goes to main screen.
          - config: high-spec
            api-level: 34
            ram-size: 6144M
            disk-size: 12288M
            emulator-options: "-no-window -no-boot-anim -no-audio -qemu -smp 8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native build tools
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      # The bundled qemu-system-x86_64 (emulator 37.x) fails to start on
      # ubuntu-24.04 runners without libpulse0:
      # "error while loading shared libraries: libpulse.so.0".
      - name: Install emulator system libraries
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      # /dev/kvm exists on the runner but the runner user cannot open it
      # ("ProbeKVM: This user doesn't have permissions to use KVM"), forcing
      # the emulator onto TCG software emulation where cold boot takes 15+
      # minutes and hits the action's boot timeout. Granting access enables
      # hardware acceleration.
      - name: Enable KVM for emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          else
            echo "No /dev/kvm; emulator will fall back to software acceleration"
          fi

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64"
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Launch app on emulator and capture screens (${{ matrix.config }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: ${{ matrix.ram-size }}
          heap-size: 512M
          disk-size: ${{ matrix.disk-size }}
          disable-animations: true
          emulator-options: ${{ matrix.emulator-options }}
          script: |
            echo "=== Device info ===" | tee "$GITHUB_WORKSPACE/device-info.txt"
            adb shell getprop ro.product.cpu.abi | tee -a "$GITHUB_WORKSPACE/device-info.txt"
            adb shell getprop ro.product.cpu.abilist | tee -a "$GITHUB_WORKSPACE/device-info.txt"
            echo "cpu_count=$(adb shell 'grep -c ^processor /proc/cpuinfo')" | tee -a "$GITHUB_WORKSPACE/device-info.txt"
            adb shell cat /proc/meminfo | head -n 2 | tee -a "$GITHUB_WORKSPACE/device-info.txt"
            echo "meminfo exit: $?"
            adb shell df -h /data | tee -a "$GITHUB_WORKSPACE/device-info.txt"
            echo "df exit: $?"
            echo "Searching for APKs under $GITHUB_WORKSPACE..."
            find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null | head -n 5
            APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null | head -n1)
            echo "APK path: [$APK]"
            if [ -z "$APK" ]; then
              echo "ERROR: no APK found; listing build outputs:"
              ls -R app/build/outputs 2>&1 | head -n 40 || true
              exit 1
            fi
            echo "Installing $APK"
            adb install "$APK"
            echo "adb install exit code: $?"
            adb shell monkey -p com.hartmann.pixeldream -c android.intent.category.LAUNCHER 1
            echo "monkey exit code: $?"
            echo "Waiting for launch..."
            sleep 40
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/launch.png"
            adb shell uiautomator dump /sdcard/ui.xml
            adb pull /sdcard/ui.xml "$GITHUB_WORKSPACE/ui.xml"
            python3 - "$GITHUB_WORKSPACE/ui.xml" <<'PYEOF'
            import re, subprocess, sys
            path = sys.argv[1]
            xml = open(path, encoding="utf-8", errors="replace").read()
            m = re.search(r'text="Got it"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml)
            if not m:
                print("Got it button not found in ui.xml; skipping tap")
                sys.exit(0)
            x1, y1, x2, y2 = map(int, m.groups())
            x, y = (x1 + x2) // 2, (y1 + y2) // 2
            print(f"Tapping Got it at {x},{y}")
            subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
            PYEOF
            sleep 5
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/after-dismiss.png"
            adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt"
            echo "Smoke test capture complete"

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.config }}
          path: |
            launch.png
            after-dismiss.png
            ui.xml
            logcat.txt
            device-info.txt
